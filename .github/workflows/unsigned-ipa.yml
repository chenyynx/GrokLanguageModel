name: Unsigned IPA (GrokChat)

# Builds the GrokChat iOS example app for device as an unsigned IPA,
# for sideload signing with a personal certificate. Artifact: GrokChat-unsigned-ipa.
# Note: GrokChat requires iOS 27+ (Foundation Models custom-model support).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/unsigned-ipa.yml']

permissions:
  contents: read

jobs:
  build-ipa:
    name: Build GrokChat unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      XCODE_PATH: /Applications/Xcode_27.1.app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          swift --version

      - name: Ensure the iOS platform is installed
        run: |
          destinations=$(xcodebuild -showdestinations -project "Examples/GrokChat-iOS/GrokChat.xcodeproj" -scheme GrokChat 2>&1 || true)
          if grep -q "error:iOS [0-9.]* is not installed" <<< "$destinations"; then
            xcodebuild -downloadPlatform iOS
          fi

      - name: Archive GrokChat for device (unsigned)
        run: |
          set +e
          xcodebuild archive \
            -project Examples/GrokChat-iOS/GrokChat.xcodeproj \
            -scheme GrokChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GrokChat.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -skipMacroValidation -skipPackagePluginValidation \
            2>&1 | tee "$RUNNER_TEMP/build.log" | tail -n 120
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "==== error lines ===="
            grep -n " error: " "$RUNNER_TEMP/build.log" | head -40
          fi
          exit "$status"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/GrokChat.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit 2>/dev/null || true)
          if [ -z "$APP" ]; then echo "::error::No .app found in the archive"; exit 1; fi
          echo "App bundle: $APP"
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R "$APP" "$RUNNER_TEMP/Payload/"
          (cd "$RUNNER_TEMP" && zip -qry GrokChat-unsigned.ipa Payload)
          ls -lh "$RUNNER_TEMP/GrokChat-unsigned.ipa"
          unzip -l "$RUNNER_TEMP/GrokChat-unsigned.ipa" | head -25

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: GrokChat-unsigned-ipa
          path: ${{ runner.temp }}/GrokChat-unsigned.ipa
          if-no-files-found: error
